
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advantage-os"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "inventory*",
    "creative_studio*",
    "trend_predictor*"
]

[tool.fastapi]
entrypoint = "main:app"
