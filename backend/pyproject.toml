[project]
name = "advantage-os"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "openpyxl>=3.1.2",
    "nltk>=3.8.1",
    "vaderSentiment>=3.3.2",
    "transformers>=4.38.0",
    "cohere>=5.0.0",
    "groq>=0.5.0",
    "openai>=1.14.0",
    "pillow>=10.2.0",
    "pytesseract>=0.3.10",
    "beautifulsoup4>=4.12.3",
    "matplotlib==3.10.9",
    "reddit_scrap",
    "praw>=7.7.1"
]

[tool.fastapi]
entrypoint = "main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["inventory*", "creative_studio*", "trend_predictor*"]
